name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────
  # REQUIRED GATES: go-lint, go-test
  # GitLab CI is the source of truth; this workflow
  # is a lightweight mirror check only.
  # ─────────────────────────────────────────────────

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8
      - name: Run golangci-lint
        run: golangci-lint run ./... --timeout=5m

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [go-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: CGO_ENABLED=1 go test -race -count=1 ./...

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [go-lint, go-test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.go-lint.result }}" != "success" ]] || \
             [[ "${{ needs.go-test.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
