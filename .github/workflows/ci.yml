name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  CGO_ENABLED: "0"

jobs:
  # ─────────────────────────────────────────────────
  # Tier 1: Fast checks (no Nix, no self-hosted)
  # ─────────────────────────────────────────────────

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test -race -count=1 ./...

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: CGO_ENABLED=${{ env.CGO_ENABLED }} go build -ldflags="-s -w" -o ivali ./cmd/ivali/
      - run: CGO_ENABLED=${{ env.CGO_ENABLED }} go build -ldflags="-s -w" -o bw-tui ./cmd/bw-tui/
      - run: CGO_ENABLED=${{ env.CGO_ENABLED }} go build -ldflags="-s -w" -o ivali-bot ./cmd/ivali-bot/
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: |
            ivali
            bw-tui
            ivali-bot
          retention-days: 30

  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts
          additional_files: "diagnostic.sh shell-migrate.sh"

  # ─────────────────────────────────────────────────
  # Tier 2: Nix checks (cached with Cachix)
  # ─────────────────────────────────────────────────

  nix-format:
    name: Nix Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix fmt -- --check

  nix-flake-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake metadata
      - run: nix flake check --no-build --print-build-logs

  # ─────────────────────────────────────────────────
  # Tier 3: Security scanning
  # ─────────────────────────────────────────────────

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────
  # Tier 4: Integration tests (self-hosted)
  # ─────────────────────────────────────────────────

  nixos-build:
    name: NixOS Build
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - name: Build NixOS toplevel
        run: nix build .#nixosConfigurations.prague.config.system.build.toplevel --no-link --print-build-logs
      - name: Build Home Manager
        run: nix build .#hm-activate --no-link --print-build-logs

  nixos-testvm:
    name: NixOS Test VM
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - name: Build test VM
        run: nix build .#nixosConfigurations.testvm.config.system.build.toplevel --no-link --print-build-logs || true

  # ─────────────────────────────────────────────────
  # Tier 5: Report status back to GitLab (source of truth)
  # ─────────────────────────────────────────────────
  # GitLab is the source of truth and push-mirrors to GitHub. GitHub Actions
  # validates the mirror and posts the commit status back to GitLab so the
  # GitLab pipeline view reflects validation — no GitLab CI minutes consumed.

  gitlab-status:
    name: Report status to GitLab
    runs-on: ubuntu-latest
    needs: [go-lint, go-test, go-build, shell-lint, nix-format, nix-flake-check, secret-scan]
    if: always()
    steps:
      - name: Compute status
        id: status
        run: |
          if [ "${{ needs.go-lint.result }}" != "success" ] || \
             [ "${{ needs.go-test.result }}" != "success" ] || \
             [ "${{ needs.go-build.result }}" != "success" ] || \
             [ "${{ needs.shell-lint.result }}" != "success" ] || \
             [ "${{ needs.nix-format.result }}" != "success" ] || \
             [ "${{ needs.nix-flake-check.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
            echo "desc=GitHub Actions validation failed" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "desc=GitHub Actions validation passed" >> "$GITHUB_OUTPUT"
          fi

      - name: Post commit status to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: "willisivali/nixos-infrastructure"
        run: |
          PROJECT=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$GITLAB_PROJECT")
          curl -s -X POST \
            "https://gitlab.com/api/v4/projects/${PROJECT}/statuses/${{ github.sha }}" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --form "state=${{ steps.status.outputs.state }}" \
            --form "name=github-actions" \
            --form "description=${{ steps.status.outputs.desc }}" \
            --form "target_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ─────────────────────────────────────────────────
  # Summary
  # ─────────────────────────────────────────────────

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [go-lint, go-test, go-build, shell-lint, nix-format, nix-flake-check, secret-scan]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.go-lint.result }}" != "success" ]] || \
             [[ "${{ needs.go-test.result }}" != "success" ]] || \
             [[ "${{ needs.go-build.result }}" != "success" ]] || \
             [[ "${{ needs.shell-lint.result }}" != "success" ]] || \
             [[ "${{ needs.nix-format.result }}" != "success" ]] || \
             [[ "${{ needs.nix-flake-check.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
