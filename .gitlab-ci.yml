stages:
  - lint
  - architecture
  - test
  - security
  - check
  - build

# ── Global defaults ────────────────────────────────────────────────────────

default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 15m

# ── Lint ──────────────────────────────────────────────────────────────────

nix-format:
  stage: lint
  image: nixos/nix:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix fmt -- --check .

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - shellcheck --severity=warning scripts/*.sh

go-lint:
  stage: lint
  image: golangci/golangci-lint:v2.12.2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - golangci-lint run ./... --timeout=5m
  cache:
    key: golangci-lint
    paths:
      - .cache/golangci-lint

# ── Architecture ──────────────────────────────────────────────────────────

architecture-check:
  stage: architecture
  image: golang:1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go build -o /tmp/check-architecture ./cmd/check-architecture/
    - /tmp/check-architecture/
  artifacts:
    when: always
    paths:
      - architecture/
    expire_in: 7 days

# ── Test ──────────────────────────────────────────────────────────────────

go-build:
  stage: test
  image: golang:1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go build ./...
  cache:
    key: go-mod-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/go-mod
      - .cache/go-build
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

go-test:
  stage: test
  image: golang:1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - CGO_ENABLED=1 go test -race -count=1 -json ./... > test-results.json || true
    - |
      if [ -f test-results.json ]; then
        echo "=== Test Summary ==="
        go tool test2json -testfile test-results.json 2>/dev/null || cat test-results.json
      fi
    - CGO_ENABLED=1 go test -race -count=1 ./...
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - test-results.json
    expire_in: 7 days
  cache:
    key: go-mod-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/go-mod
      - .cache/go-build
  variables:
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

# ── Security ──────────────────────────────────────────────────────────────

go-security:
  stage: security
  image: golang:1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -fmt=golint -exclude-generated ./... 2>&1 || true
    - gosec -fmt=sarif -out=gosec-results.sarif -exclude-generated ./... 2>&1 || true
  artifacts:
    when: always
    reports:
      sast: gosec-results.sarif
    expire_in: 7 days
  allow_failure: true

# ── Check ─────────────────────────────────────────────────────────────────

nix-flake-check:
  stage: check
  image: nixos/nix:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix flake check --no-build
  cache:
    key: nix-store-${CI_COMMIT_REF_SLUG}
    paths:
      - /nix/store

# ── Build (evaluation only, no deployment) ─────────────────────────────────
# Deployment is handled exclusively by the GitOps reconciler (gitops-reconciler.service).
# CI NEVER runs nixos-rebuild switch. This ensures:
# 1. All changes flow through feature branches and merge requests
# 2. Deployment only occurs after merge to main
# 3. GitOps maintains the single source of truth

nixos-eval-prague:
  stage: build
  image: nixos/nix:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix eval .#nixosConfigurations.prague.config.system.build.toplevel.name
  cache:
    key: nix-store-${CI_COMMIT_REF_SLUG}
    paths:
      - /nix/store
