stages:
  - test
  - build
  - deploy
  - notify

variables:
  CGO_ENABLED: "0"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    fallback = true
    max-jobs = auto

.default_tags:
  tags:
    - nixos
    - self-hosted

.common_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml

# ============================================
# VALIDATE
# ============================================

# Self-test: validate .gitlab-ci.yml syntax
validate-ci:
  script:
    - nix-shell -p yamllint --run "yamllint -d relaxed .gitlab-ci.yml"
  extends: .default_tags
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml

# ============================================
# TEST
# ============================================

go-test:
  stage: test
  script:
    - go test ./...
  extends: .default_tags

go-build:
  stage: test
  needs: ["go-test"]
  script:
    - go build -o ivali ./cmd/ivali/
  artifacts:
    expire_in: 30 days
    paths:
      - ivali
  extends: .default_tags

nix-check:
  stage: test
  needs: []
  tags:
    - nixos
    - self-hosted
  script:
    - nix --version
    - nix flake metadata
    - nix flake check --no-build
  extends: .common_rules

# ============================================
# BUILD
# ============================================

nix-build:
  stage: build
  needs: ["nix-check"]
  script:
    - nix build ".#hm-activate" --print-build-logs
  extends: .default_tags
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
      when: on_success

nixos-build:
  stage: build
  needs: ["nix-check"]
  script:
    - nix build ".#nixosConfigurations.prague.config.system.build.toplevel" --print-build-logs
  extends: .default_tags
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
      when: on_success

# ============================================
# DEPLOY
# ============================================

deploy:
  stage: deploy
  needs: ["nixos-build"]
  script:
    - sudo systemctl start ci-deploy.service
  extends: .default_tags
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

notify:
  stage: notify
  needs: ["deploy"]
  script:
    - cat > /tmp/ci-notify.env <<EOF
PIPELINE_BRANCH='$CI_COMMIT_BRANCH'
PIPELINE_SHA='$CI_COMMIT_SHORT_SHA'
PIPELINE_AUTHOR='$CI_COMMIT_AUTHOR'
PIPELINE_MESSAGE='$CI_COMMIT_MESSAGE'
PIPELINE_URL='$CI_PIPELINE_URL'
EOF
    - sudo systemctl start ci-notify.service
  extends: .default_tags
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
