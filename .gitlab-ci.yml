stages:
  - lint
  - architecture
  - test
  - security
  - check
  - build

# ── Global defaults ────────────────────────────────────────────────────────

default:
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  timeout: 15m
  variables:
    GIT_CLEAN_FLAGS: "-ffdx -e .cache/"

# ── Lint ──────────────────────────────────────────────────────────────────

nix-format:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix fmt -- --check .

shellcheck:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix run nixpkgs#shellcheck -- --severity=warning scripts/*.sh

go-lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix run nixpkgs#golangci-lint -- run ./... --timeout=5m

# ── Architecture ──────────────────────────────────────────────────────────

architecture-check:
  stage: architecture
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go build -o /tmp/check-architecture ./cmd/check-architecture/
    - /tmp/check-architecture
  artifacts:
    when: always
    paths:
      - architecture/
    expire_in: 7 days

# ── Test ──────────────────────────────────────────────────────────────────

go-build:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go build ./...

go-test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - CGO_ENABLED=1 go test -race -count=1 -json ./... > test-results.json
    - |
      if [ -f test-results.json ]; then
        echo "=== Test Summary ==="
        go tool test2json -testfile test-results.json 2>/dev/null || cat test-results.json
      fi
    - CGO_ENABLED=1 go test -race -count=1 ./...
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - test-results.json
    expire_in: 7 days

# ── Security ──────────────────────────────────────────────────────────────

go-security:
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -fmt=golint -exclude-generated ./... 2>&1 || true
    - gosec -fmt=sarif -out=gosec-results.sarif -exclude-generated ./... 2>&1 || true
  artifacts:
    when: always
    reports:
      sast: gosec-results.sarif
    expire_in: 7 days
  allow_failure: true

# ── Check ─────────────────────────────────────────────────────────────────

nix-flake-check:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix flake check --no-build

# ── Build (evaluation only, no deployment) ─────────────────────────────────
# Deployment is handled exclusively by the GitOps reconciler (gitops-reconciler.service).
# CI NEVER runs nixos-rebuild switch. This ensures:
# 1. All changes flow through feature branches and merge requests
# 2. Deployment only occurs after merge to main
# 3. GitOps maintains the single source of truth

nixos-eval-prague:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - nix eval .#nixosConfigurations.prague.config.system.build.toplevel.name
