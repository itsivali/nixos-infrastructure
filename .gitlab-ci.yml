stages:
  - test
  - build
  - deploy

variables:
  CGO_ENABLED: "0"

  # Nix config for nix jobs
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    fallback = true
    max-jobs = auto

cache:
  key: "go-${CI_COMMIT_REF_SLUG}"
  paths:
    - .go-cache/

# -----------------------------
# Go Unit Tests
# -----------------------------
go-test:
  image: golang:1.24
  stage: test
  script:
    - go test ./...
  cache:
    key: "go-${CI_COMMIT_REF_SLUG}"
    paths:
      - .go-cache/

# -----------------------------
# Go Build (verify compilation)
# -----------------------------
go-build:
  image: golang:1.24
  stage: build
  needs: ["go-test"]
  script:
    - go build -o ivali ./cmd/ivali/
  artifacts:
    expire_in: 30 days
    paths:
      - ivali

# -----------------------------
# Nix Flake Validation
# -----------------------------
nix-check:
  image: nixos/nix:latest
  stage: test
  needs: []
  script:
    - nix --version
    - nix flake metadata
    - nix flake check --no-build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# -----------------------------
# Nix Build (hm-activate)
# -----------------------------
nix-build:
  image: nixos/nix:latest
  stage: build
  needs: ["nix-check"]
  script:
    - nix build ".#hm-activate" --print-build-logs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

# -----------------------------
# NixOS system build (manual, main only)
# -----------------------------
nixos-build:
  image: nixos/nix:latest
  stage: build
  needs: ["nix-check"]
  script:
    - nix build ".#nixosConfigurations.prague.config.system.build.toplevel" --print-build-logs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

# -----------------------------
# Deploy to fleet (manual)
# -----------------------------
deploy:
  image: nixos/nix:latest
  stage: deploy
  needs: ["nixos-build"]
  script:
    - echo "Deploy step — configure your target host here"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
