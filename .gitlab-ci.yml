stages:
  - validate
  - test
  - build
  - deploy

variables:
  CGO_ENABLED: "0"

  NIX_CONFIG: |
    experimental-features = nix-command flakes
    accept-flake-config = true
    fallback = true
    max-jobs = auto

  # Pin hashes for supply-chain integrity (updated via `nix run nixpkgs#skopeo -- inspect docker://...`)
  GOLANG_IMAGE: "golang:1.24@sha256:4e6230a9d1584077dcd1c0a1004f11af30bfaa9aab573a896bd56294e7a6e1fd"
  NIX_IMAGE: "nixos/nix:latest"

cache:
  key: "go-${CI_COMMIT_REF_SLUG}"
  paths:
    - .go-cache/

.common_rules: &common_rules
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml

# ============================================
# VALIDATE
# ============================================

# Self-test: validate .gitlab-ci.yml syntax so broken CI configs never merge
validate-ci:
  stage: validate
  image: alpine:latest@sha256:0a4eaa0eecf5f8c050e5bba433f58c052be7587ee8af1e8d0e8012a0fb8344eb
  script:
    - apk add --no-cache python3 py3-yaml
    - python3 -c |
        import yaml, sys
        with open('.gitlab-ci.yml') as f:
            try:
                config = yaml.safe_load(f)
                count = sum(1 for k,v in config.items() if isinstance(v, dict) and 'script' in v)
                print(f'valid ({count} job definitions)')
            except yaml.YAMLError as e:
                print(f'parse error: {e}')
                sys.exit(1)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml

# ============================================
# TEST
# ============================================

go-test:
  stage: test
  image: "${GOLANG_IMAGE}"
  script:
    - go test ./...
  cache:
    key: "go-${CI_COMMIT_REF_SLUG}"
    paths:
      - .go-cache/

go-build:
  stage: test
  needs: ["go-test"]
  image: "${GOLANG_IMAGE}"
  script:
    - go build -o ivali ./cmd/ivali/
  artifacts:
    expire_in: 30 days
    paths:
      - ivali

nix-check:
  stage: test
  needs: []
  image: "${NIX_IMAGE}"
  script:
    - nix --version
    - nix flake metadata
    - nix flake check --no-build
  <<: *common_rules

# ============================================
# BUILD
# ============================================

nix-build:
  stage: build
  needs: ["nix-check"]
  image: "${NIX_IMAGE}"
  script:
    - nix build ".#hm-activate" --print-build-logs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
      when: manual

nixos-build:
  stage: build
  needs: ["nix-check"]
  image: "${NIX_IMAGE}"
  script:
    - nix build ".#nixosConfigurations.prague.config.system.build.toplevel" --print-build-logs
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - .gitlab-ci.yml
      when: manual

# ============================================
# DEPLOY
# ============================================

deploy:
  stage: deploy
  needs: ["nixos-build"]
  image: "${NIX_IMAGE}"
  script:
    - echo "Deploy step — configure your target host here"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
