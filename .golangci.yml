run:
  timeout: 60s
  modules-download-mode: readonly

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - whitespace
  disable:
    - paralleltest

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/willisivali/nixos-infrastructure
  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        disabled: true
