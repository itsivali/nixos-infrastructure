version: "2"

run:
  timeout: 60s

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - whitespace
  exclusions:
    paths:
      - vendor
    rules:
      - linters:
          - staticcheck
        text: "QF1012"
      - linters:
          - staticcheck
        text: "QF1003"
      - linters:
          - staticcheck
        text: "QF1002"
      - linters:
          - errcheck
        text: "Error return value of `.*Close`"
      - linters:
          - errcheck
        text: "Error return value of `os.Remove`"
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/itsivali/nixos-infrastructure
