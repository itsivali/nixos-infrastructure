# Architecture Manifest: Dependency Graph

#

# PURPOSE

# -------

# This manifest is the authoritative, machine-readable record of

# cross-domain dependencies detected in the repository.

#

# It serves two purposes:

#

# 1. Describe dependencies that actually exist in repository source.

# 2. Provide the enforcement input used by architecture validation.

#

# IMPORTANT

# ---------

# This file MUST NOT be treated as a permission to create new dependencies.

# A dependency is valid only when:

#

# - the source and target are valid architectural domains/resources;

# - the dependency is permitted by architecture/domains.yaml;

# - the dependency respects domain hierarchy;

# - the dependency uses the target's declared public interface;

# - state/filesystem ownership is respected;

# - no architecture exception is required unless explicitly declared;

# - the dependency is covered by verification.

#

# Repository reality remains authoritative over this manifest.

# If this manifest disagrees with the implementation, the discrepancy

# MUST be reported and resolved rather than silently normalised.

manifest:
schema_version: "3.0"
kind: dependency_graph
authoritative: true

purpose:
- repository_dependency_inventory
- architecture_enforcement
- dependency_boundary_validation
- state_ownership_validation
- filesystem_boundary_validation
- migration_tracking

governing_documents:
domain_model: architecture/domains.yaml
exceptions: architecture/exceptions.yaml
architecture: ARCHITECTURE.md
audit: ARCHITECTURE_AUDIT.md
progress: ARCHITECTURE_PROGRESS.md
stabilization: STABILIZATION.md
migration_readiness: MIGRATION-READINESS.md
engineering_contract: ENGINEERING.md
ai_contract: AGENTS.md
delivery_flow: IVALi_FLOW.md

source_of_truth:
implementation: repository_source
domain_policy: architecture/domains.yaml
exceptions: architecture/exceptions.yaml
dependency_inventory: architecture/dependencies.yaml

# ---------------------------------------------------------------------------

# DEPENDENCY TYPES

# ---------------------------------------------------------------------------

dependency_types:

nix_import:
description: >
A Nix module, expression, or configuration file imports another
Nix module or architecture-owned resource.
enforcement: strict

path_reference:
description: >
A source file references an executable, script, configuration file,
generated artifact, or repository-owned path.
enforcement: strict

builtins_read_file:
description: >
Nix evaluates and embeds the contents of another file at evaluation
time using builtins.readFile or equivalent.
enforcement: strict

sops_reference:
description: >
A Nix module or service references an encrypted SOPS/age secret.
enforcement: strict

option_namespace:
description: >
A source domain reads configuration options owned by another domain.
enforcement: strict

filesystem_access:
description: >
A component reads, writes, creates, deletes, or manages state in a
filesystem location owned by another domain.
enforcement: strict

service_state:
description: >
A service creates or manages persistent runtime state owned by a
different service/domain.
enforcement: strict

generated_artifact:
description: >
A component consumes an artifact generated by another component.
enforcement: strict

runtime_api:
description: >
A runtime service communicates with another service through an
explicit API, socket, RPC, HTTP, IPC, or equivalent contract.
enforcement: strict

command_invocation:
description: >
A component invokes an executable owned by another domain.
enforcement: strict

# ---------------------------------------------------------------------------

# SEVERITY

# ---------------------------------------------------------------------------

severity_levels:

allowed:
meaning: >
Dependency is explicitly permitted by the domain architecture and
conforms to the relevant ownership and interface rules.

questionable:
meaning: >
Dependency currently exists but requires architectural review,
explicit justification, migration tracking, or an exception.

transitional:
meaning: >
Dependency is intentionally retained during a documented migration
and MUST have an owner, rationale, migration target, and exit criteria.

violation:
meaning: >
Dependency violates an architectural invariant or declared domain
boundary and MUST block architectural acceptance unless an explicit
approved exception applies.

