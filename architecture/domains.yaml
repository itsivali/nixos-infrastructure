# ===================================================================

# GLOBAL ARCHITECTURE INVARIANTS

# ===================================================================

#

# These rules apply to every domain.

#

architecture_invariants:

dependency_direction:
description: >
Dependencies must flow from higher architectural levels toward
lower architectural levels. Lower-level domains must never
depend on higher-level domains.
rule: >
dependency.level <= consumer.level

public_interface_only:
description: >
Cross-domain imports must target a declared public interface.
Direct access to another domain's internal implementation is
prohibited.
rule: >
cross_domain_imports_must_target_public_paths

filesystem_ownership:
description: >
Every repository path must have at most one architectural owner.
Overlapping domain ownership is prohibited.
rule: >
exactly_one_owner_per_declared_path

no_undeclared_domains:
description: >
A path belonging to a domain must not be treated as an
architectural dependency of another domain unless that dependency
is declared here or explicitly excepted.
rule: >
all_dependencies_must_be_declared

state_ownership:
description: >
Persistent or authoritative runtime state must have exactly one
owner. Other domains may consume that state through a declared
contract but must not independently create competing state.
rule: >
one_state_path_one_owner

observability_is_consumer:
description: >
Observability collects, transforms, stores, and exposes telemetry
about other domains. It does not own the operational state of
those domains.
rule: >
observability_must_not_own_external_service_state

host_composition:
description: >
Hosts compose domains and select capabilities. Reusable business,
platform, or runtime logic must not be implemented directly inside
host composition files.
rule: >
hosts_are_composition_roots

shared_is_not_a_dumping_ground:
description: >
Shared domains exist only for genuinely reusable capabilities.
Moving code into shared/ merely to bypass a dependency restriction
is prohibited.
rule: >
shared_domains_require_reuse_justification

exceptions_are_explicit:
description: >
Architectural exceptions must never be encoded by weakening this
manifest. They must be declared and justified separately.
rule: >
exceptions_must_be_declared_in_architecture_exceptions

no_wildcard_escape:
description: >
A wildcard dependency declaration must not be used by lower-level
domains to bypass architecture boundaries.
rule: >
wildcard_dependencies_allowed_only_for_composition_roots

# ===================================================================

# DOMAIN OWNERSHIP RULES

# ===================================================================

ownership:

path_overlap:
severity: error
rule: >
No two domains may claim the same filesystem path.

public_overlap:
severity: error
rule: >
A public interface may belong to exactly one domain.

internal_escape:
severity: error
rule: >
External domains must not import another domain's internal paths.

orphan_paths:
severity: warning
rule: >
Architectural paths should be assigned to a domain. Unowned
architectural code requires explicit classification.

# ===================================================================

# DEPENDENCY RULES

# ===================================================================

dependencies:

level_order:
severity: error
rule: >
A domain may depend only on domains at a lower level or explicitly
approved same-level shared contracts.

undeclared:
severity: error
rule: >
Every cross-domain dependency must match an allowed dependency.

forbidden:
severity: error
rule: >
A dependency matching a forbidden pattern is always rejected.

internal_import:
severity: error
rule: >
Cross-domain imports into internal paths are prohibited.

circular:
severity: error
rule: >
The domain dependency graph must be acyclic.

exception_required:
severity: error
rule: >
Any intentional violation requires an entry in
architecture/exceptions.yaml.

# ===================================================================

# STATE RULES

# ===================================================================

state:

single_owner:
severity: error
rule: >
Each authoritative state path has exactly one owner.

no_shadow_state:
severity: error
rule: >
A consumer must not create a second authoritative copy of state
already owned by another domain without an explicit replication
contract.

observability_read_only:
severity: error
rule: >
Telemetry systems may observe service state but must not become
authoritative owners of that state.

recovery_authority:
severity: error
rule: >
Recovery may restore or manipulate another domain's state only
through an explicitly defined recovery contract. Recovery does not
permanently own that service state.

# ===================================================================

# VERIFICATION CONTRACT

# ===================================================================

verification:

manifest:
required:
- schema-validation
- duplicate-domain-detection
- duplicate-path-detection
- duplicate-public-interface-detection

architecture:
required:
- forbidden-imports
- circular-dependencies
- filesystem-boundaries
- duplicate-ownership
- declared-dependencies
- internal-api-boundaries
- service-state-ownership

changes:
rule: >
Any change to a domain must execute the verification gates
declared by that domain and all mandatory repository-wide gates.

mandatory_repository_gates:
- format
- architecture-tests
- architecture-linter
- language-tests
- static-analysis
- nix-evaluation

deployment:
rule: >
Successful local verification does not constitute deployment.
Deployment must continue through Ivali Flow and the repository's
CI/GitOps/deployment gates.

# ===================================================================

# CHANGE CONTROL

# ===================================================================

change_control:

domain_creation:
requires:
- unique_domain_name
- unique_paths
- explicit_level
- explicit_dependencies
- public_interface
- state_ownership_decision
- verification_contract

domain_removal:
requires:
- dependency_graph_update
- ownership_reconciliation
- architecture_tests
- documentation_update

dependency_change:
requires:
- architecture_review
- dependency_graph_update
- architecture_tests
- architecture_linter

public_interface_change:
requires:
- consumer_inventory
- compatibility_review
- affected_domain_tests
- architecture_tests

state_owner_change:
requires:
- explicit_migration_plan
- backup_or_recovery_plan
- rollback_plan
- state_ownership_verification

exception_change:
requires:
- architecture/exceptions.yaml
- written_justification
- owner
- expiry_or_review_date
- verification_coverage

# ===================================================================

# MIGRATION / TRANSITION RULES

# ===================================================================

#

# Architecture manifests describe the intended enforceable structure.

# During migrations, temporary discrepancies may exist.

#

# Such discrepancies must be represented explicitly rather than silently

# tolerated.

#

migration:

legacy_paths:
rule: >
Legacy paths must either be assigned to an existing domain or
explicitly classified as migration-only.

transitional_dependencies:
rule: >
Temporary dependency violations require an architecture exception.

migration_tracking:
required_documents:
- ARCHITECTURE_AUDIT.md
- ARCHITECTURE_PROGRESS.md

completion:
rule: >
A migration is complete only when implementation, manifest,
dependency graph, tests, and documentation agree.

# ===================================================================

# CANONICAL DOMAIN HIERARCHY

# ===================================================================

hierarchy:

level_0:
