# Architecture Manifest: Domain Definitions

#

# This file is an EXECUTABLE ARCHITECTURE CONTRACT.

#

# It defines:

# - domain ownership

# - filesystem boundaries

# - public interfaces

# - internal implementation paths

# - dependency direction

# - architectural level

# - state ownership

# - verification expectations

#

# Architecture invariant:

#

# Hosts compose capabilities.

# Domains own capabilities.

# Services expose contracts.

# Infrastructure adapters implement those contracts.

#

# Dependency direction:

#

# Level 0 → Level 1 → Level 2 → Level 3 → Level 4

#

# A higher-level domain MAY depend on a lower-level domain.

# A lower-level domain MUST NOT depend on a higher-level domain.

#

# Exceptions MUST be explicitly declared in:

#

# architecture/exceptions.yaml

#

# The architecture linter MUST treat this file as authoritative for

# domain ownership and dependency boundaries.

#

# -------------------------------------------------------------------

# DOMAIN SCHEMA

# -------------------------------------------------------------------

#

# name:

# Canonical domain identifier.

#

# level:

# Architectural level.

# 0 = foundational/core

# 1 = platform/shared infrastructure

# 2 = functional capability

# 3 = runtime/operational services

# 4 = host composition

#

# kind:

# Domain classification.

#

# paths:

# Filesystem paths owned exclusively by the domain.

#

# public:

# Public entry points exposed to other domains.

#

# internal:

# Implementation paths owned by the domain and not directly imported

# by external domains.

#

# allowed_dependencies:

# Domains that this domain may depend upon.

#

# forbidden_dependencies:

# Explicitly prohibited domains.

#

# state_owner:

# Whether this domain is permitted to own persistent/runtime state.

#

# verification:

# Architectural and functional verification expected for changes.

#

# -------------------------------------------------------------------

domains:

