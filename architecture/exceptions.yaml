# EXC-015

# -------------------------------------------------------------------------

* id: EXC-015
  class: hierarchy_violation

  source: hosts/prague.nix
  target: /var/lib/observability

  dependency:
  type: filesystem_access
  access: write
  target_owner: runtime.observability

  reason: >
  Host composition enables observability features whose runtime state is
  stored under the observability-owned filesystem hierarchy.

  owner: hosts

  risk: high

  status: needs_resolution

  scope:
  permitted_operations:
  - host_composition
  - capability_enablement
  prohibited_operations:
  - direct_runtime_state_ownership
  - direct_observability_state_mutation

  architectural_interpretation: >
  Host composition itself is valid. Direct host ownership of runtime
  observability state is not. The host should compose the observability
  capability while runtime.observability retains state ownership.

  controls:

  * host remains a composition layer
  * runtime.observability owns its state
  * host configuration must not become a second state owner

  migration:
  target: runtime.observability
  strategy: >
  Separate host capability enablement from runtime state ownership.
  exit_condition: >
  prague.nix composes observability without directly owning or managing
  /var/lib/observability state.
  priority: high

  review: 2026-10-15

  verification:

  * architecture-validation
  * host-composition-validation
  * filesystem-ownership
