# Architecture Manifest: Exception Registry

#

# PURPOSE

# -------

# This manifest is the authoritative registry for architecture exceptions.

#

# An exception permits a specific architectural deviation that would otherwise

# fail architecture validation.

#

# An exception is NOT a general permission to violate architecture rules.

# It is:

#

# - narrowly scoped;

# - explicitly owned;

# - justified by evidence;

# - risk-assessed;

# - protected by compensating controls;

# - independently verifiable;

# - reviewed on a defined schedule;

# - removed when the underlying dependency is eliminated.

#

# IMPORTANT

# ---------

# Normal, architecture-compliant dependencies MUST NOT be represented here.

#

# Examples:

#

# core.boot -> shared.theme

#

# is not automatically an exception if domains.yaml explicitly permits it.

#

# Conversely:

#

# runtime.ci -> runtime.automation state

#

# MAY require an exception when CI directly mutates automation-owned state.

#

# An exception MUST NEVER be used to conceal:

#

# - an undeclared dependency;

# - an incorrect state owner;

# - an invalid filesystem boundary;

# - a missing public interface;

# - a forbidden dependency;

# - a circular dependency;

# - an expired migration;

# - an implementation that simply has not been documented.

#

# Architecture validation MUST fail closed for invalid, expired, ownerless,

# malformed, or unverified exceptions.

manifest:
schema_version: "3.0"
kind: architecture_exception_registry
authoritative: true

purpose:
- exception_management
- architecture_enforcement
- risk_tracking
- migration_tracking
- ownership_tracking
- review_tracking

governing_documents:
domain_model: architecture/domains.yaml
dependency_graph: architecture/dependencies.yaml
architecture: ARCHITECTURE.md
audit: ARCHITECTURE_AUDIT.md
progress: ARCHITECTURE_PROGRESS.md
stabilization: STABILIZATION.md
migration_readiness: MIGRATION-READINESS.md
engineering_contract: ENGINEERING.md
ai_contract: AGENTS.md
delivery_flow: IVALi_FLOW.md

# ---------------------------------------------------------------------------

# EXCEPTION CLASSIFICATION

# ---------------------------------------------------------------------------

exception_classes:

hierarchy_violation:
description: >
Dependency crosses the architectural hierarchy in a direction that is
not normally permitted.
default_risk: high

state_ownership:
description: >
A component accesses or mutates persistent state owned by another domain.
default_risk: critical

filesystem_boundary:
description: >
A component directly accesses another domain's filesystem-owned state.
default_risk: high

public_interface_bypass:
description: >
A component consumes another domain's implementation rather than its
declared public interface.
default_risk: high

option_namespace:
description: >
A component reads configuration options owned by another domain without
an explicitly declared public configuration contract.
default_risk: medium

implementation_coupling:
description: >
A component depends directly on another component's implementation
rather than an explicit contract.
default_risk: medium

legacy_migration:
description: >
A dependency is retained temporarily while the repository migrates from
an older architecture.
default_risk: medium

security_boundary:
description: >
A dependency crosses a security boundary requiring explicit approval.
default_risk: critical

# ---------------------------------------------------------------------------

# LIFECYCLE

# ---------------------------------------------------------------------------

lifecycle:

proposed:
meaning: >
Exception has been identified but has not yet been approved.
enforcement: >
MUST NOT permit the dependency to pass architecture gates.

active:
meaning: >
Exception is approved, owned, within review period, and currently
required by the implementation.
enforcement: >
Dependency may pass only within the exact scope of the exception.

transitional:
meaning: >
Exception is intentionally retained during an approved migration.
enforcement: >
MUST have a migration target and explicit exit condition.

needs_resolution:
meaning: >
Existing exception requires architectural remediation or ownership
clarification.
enforcement: >
May pass only according to the stabilization policy; MUST remain visible
as technical debt.

needs_contract:
meaning: >
Existing dependency requires replacement with an explicit service,
option, or public API contract.
enforcement: >
MUST have a migration target and exit condition.

expired:
meaning: >
Review period has passed without renewal or closure.
enforcement: >
MUST fail architecture validation.

rejected:
meaning: >
Exception was explicitly rejected.
enforcement: >
MUST fail architecture validation if the dependency still exists.

resolved:
meaning: >
Underlying architectural violation has been removed.
enforcement: >
Exception remains for historical traceability but no longer grants
permission to the dependency.

# ---------------------------------------------------------------------------

# RISK LEVELS

# ---------------------------------------------------------------------------

risk_levels:

low:
description: >
Limited architectural impact and no persistent-state or security impact.

medium:
description: >
Meaningful coupling or maintainability impact but limited operational
or security consequences.

high:
description: >
Significant boundary, reliability, deployment, or recovery impact.

critical:
description: >
State ownership, secret handling, security boundary, destructive
operation, or recovery integrity is affected.

# ---------------------------------------------------------------------------

# REQUIRED EXCEPTION FIELDS

# ---------------------------------------------------------------------------

required_fields:

* id
* class
* source
* target
* reason
* owner
* risk
* status
* review
* scope
* controls
* verification

conditional_fields:
migration:
required_when:
- status: transitional
- status: needs_resolution
- status: needs_contract

security:
required_when:
- class: security_boundary
- risk: critical

# ---------------------------------------------------------------------------

# EXCEPTIONS

# ---------------------------------------------------------------------------

exceptions:

# -------------------------------------------------------------------------

# EXC-002

# -------------------------------------------------------------------------

* id: EXC-002
  class: implementation_coupling

  source: runtime.observability/lite.nix
  target: shared.scripts/notify.sh

  dependency:
  type: builtins_read_file
  direction: observability -> shared.scripts
  interface: implementation
  access: read

  reason: >
  The observability-lite timer needs to emit alerts when system health
  degrades. It currently consumes notify.sh through builtins.readFile,
  creating a build-time dependency on the script implementation instead
  of consuming a stable notification service contract.

  owner: observability

  risk: medium

  status: active

  scope:
  permitted_operations:
  - read
  - build_time_embedding
  prohibited_operations:
  - modify_target
  - redefine_notification_policy
  - create_notification_state

  controls:

  * notify.sh remains owned by shared.scripts
  * observability does not modify notification implementation
  * dependency remains read-only
  * notification credentials remain outside the script dependency
  * architecture dependency remains explicitly recorded

  migration:
  target: runtime.services.notification
  strategy: >
  Replace direct script embedding with the notification service contract.
  exit_condition: >
  Observability emits notification events through an explicit service
  interface without embedding notify.sh implementation.
  priority: high

  review: 2026-11-01

  verification:

  * architecture-validation
  * dependency-validation
  * observability-validation
  * notification-contract-validation

# -------------------------------------------------------------------------

# EXC-003

# -------------------------------------------------------------------------

* id: EXC-003
  class: state_ownership

  source: runtime.ci
  target: /var/lib/gitops

  dependency:
  type: filesystem_access
  access: read_write
  target_owner: runtime.automation

  reason: >
  The GitLab runner requires access to the local GitOps worktree used by
  the deployment and reconciliation system. The current implementation
  allows CI to access state owned by runtime.automation.

  owner: ci

  risk: critical

  status: needs_resolution

  scope:
  permitted_operations:
  - read
  - required_ci_write
  prohibited_operations:
  - redefine_gitops_state
  - create_competing_gitops_state
  - bypass_reconciliation_policy
  - mutate_unrelated_runtime_state

  controls:

  * access is restricted to the GitOps worktree
  * automation remains the logical state owner
  * CI MUST NOT create competing authoritative state
  * access MUST be covered by filesystem permissions
  * access MUST remain observable
  * exception MUST remain explicitly referenced by dependency manifest

  migration:
  target: runtime.automation.public_api
  strategy: >
  Formalize the GitOps worktree as runtime.automation-owned state and
  expose required CI operations through a controlled public contract.
  state_directory:
  preferred: systemd StateDirectory
  owner: runtime.automation
  exit_condition: >
  CI no longer directly owns or arbitrarily mutates automation state,
  or ownership is explicitly transferred and reflected consistently
  across domains.yaml, dependencies.yaml, recovery, backup, and
  observability.
  priority: critical

  review: 2026-09-30

  verification:

  * architecture-validation
  * filesystem-ownership
  * service-state-ownership
  * systemd-state-directory-validation
  * ci-validation
  * recovery-validation

