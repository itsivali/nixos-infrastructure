  exit_condition: >
  Recovery obtains required deployment state without directly reading
  automation-owned filesystem state.
  priority: high

  review: 2026-09-30

  verification:

  * architecture-validation
  * filesystem-ownership
  * recovery-validation
  * read-only-access-validation

