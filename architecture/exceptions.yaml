# ---------------------------------------------------------------------------

# GLOBAL EXCEPTION RULES

# ---------------------------------------------------------------------------

rules:

narrow_scope:
rule: >
An exception applies only to the exact source, target, operation,
interface, and filesystem path declared in the exception.
enforcement: hard

no_wildcards:
rule: >
Exceptions MUST NOT use wildcard source or target permissions.
enforcement: hard

no_transitive_permission:
rule: >
An exception granted to one component MUST NOT authorize its callers,
dependencies, sibling services, or parent domain to perform the same
operation.
enforcement: hard

no_architecture_by_exception:
rule: >
Exceptions MUST NOT be used to permanently replace the architecture.
Repeated exceptions indicate that the architecture or public contract
requires redesign.
enforcement: hard

single_state_owner:
rule: >
An exception MUST NOT create a second logical owner for persistent state.
enforcement: hard

read_only_observer:
rule: >
Monitoring, dashboards, status commands, health checks, and metrics
exporters MUST remain read-only observers unless explicitly designated
as the state owner.
enforcement: hard

expiration:
rule: >
An exception without a current review date MUST fail validation.
enforcement: hard

owner_required:
rule: >
Every active exception MUST have a responsible domain owner.
enforcement: hard

evidence_required:
rule: >
Every exception MUST be supported by repository evidence. An exception
cannot exist solely because a document claims it exists.
enforcement: hard

dependency_registry_alignment:
rule: >
Every exception MUST correspond to an actual dependency recorded in
architecture/dependencies.yaml.
enforcement: hard

domain_registry_alignment:
rule: >
Source and target domains MUST exist in architecture/domains.yaml unless
the target is an explicitly registered filesystem/resource interface.
enforcement: hard

security:
rule: >
Exceptions MUST NOT silently weaken authentication, authorization,
secret handling, host isolation, firewall policy, or encryption.
enforcement: hard

# ---------------------------------------------------------------------------

# REVIEW POLICY

# ---------------------------------------------------------------------------

review_policy:

active:
default_review_period_days: 90

high_risk:
default_review_period_days: 60

critical:
default_review_period_days: 30

transitional:
default_review_period_days: 30

overdue:
action:
- fail_architecture_validation
- flag_for_remediation
- block_exception_renewal_without_evidence

review_evidence:
required:
- current_dependency_exists
- dependency_still_required
- owner_confirmed
- risk_reassessed
- controls_verified
- migration_status_updated

# ---------------------------------------------------------------------------

# VALIDATION CONTRACT

# ---------------------------------------------------------------------------

validation:

schema:
- manifest-schema
- required-field-validation
- enum-validation
- date-validation

identity:
- unique_exception_ids
- unique_source_target_scope
- valid_domain_references

dependency_alignment:
- dependency_exists
- dependency_matches_source
- dependency_matches_target
- dependency_type_matches
- dependency_scope_matches

lifecycle:
- status_valid
- active_has_current_review
- transitional_has_migration
- needs_resolution_has_migration
- needs_contract_has_migration
- expired_exceptions_fail

ownership:
- owner_exists
- single_state_owner
- filesystem_owner_valid

risk:
- critical_requires_controls
- high_requires_controls
- security_boundary_requires_security_review

architecture:
- hierarchy_validation
- public_interface_validation
- filesystem_boundary_validation
- state_ownership_validation
- forbidden_dependency_validation

migration:
- target_defined
- exit_condition_defined
- migration_status_current

repository:
- source_exists
- target_exists
- stale_entry_detection
- orphan_exception_detection

# ---------------------------------------------------------------------------

# CHANGE CONTROL

# ---------------------------------------------------------------------------

change_control:

create:
requires:
- repository_evidence
- dependency_entry
- affected_domain_analysis
- risk_assessment
- compensating_controls
- owner
- review_date

renew:
requires:
- evidence_dependency_still_exists
- evidence_dependency_still_required
- updated_risk_assessment
- verified_controls
- updated_migration_status

resolve:
requires:
- implementation_verification
- dependency_removed_or_reclassified
- architecture_validation
- dependency_manifest_update

modify_scope:
requires:
- new_risk_assessment
- new_verification
- architecture_review

transfer_owner:
requires:
- explicit_owner_acceptance
- risk_review
- migration_review

# ---------------------------------------------------------------------------

# ARCHITECTURAL PRINCIPLE

# ---------------------------------------------------------------------------

principle:
statement: >
Exceptions are temporary, explicit architectural debt or narrowly scoped
compatibility mechanisms. They are not an alternative dependency system.

acceptance_condition: >
The repository is architecturally compliant only when every exception is
known, scoped, owned, justified, verified, reviewable, and either actively
required or demonstrably migrating toward removal.

fail_closed: true

