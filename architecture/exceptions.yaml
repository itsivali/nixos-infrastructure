# -------------------------------------------------------------------------

# EXC-010

# -------------------------------------------------------------------------

#

# IMPORTANT:

# This is intentionally classified as resolved/non-exceptional.

#

# core.boot -> shared.theme is permitted by the refined domain architecture

# because shared.theme is explicitly exposed as a public presentation

# contract. Therefore it should NOT remain an active architecture

# exception merely because it crosses domain boundaries.

* id: EXC-010
  class: hierarchy_violation

  source: core.boot
  target: shared.theme

  dependency:
  type: nix_import
  access: read
  interface: public

  reason: >
  Historical exception created for boot Plymouth theme consumption.
  The refined architecture explicitly permits this dependency as a
  public presentation contract.

  owner: boot

  risk: low

  status: resolved

  scope:
  permitted_operations:
  - public_theme_consumption

  resolution:
  classification: normal_dependency
  action: >
  Remove this dependency from the active exception set. It belongs in
  architecture/dependencies.yaml as an allowed dependency.
  reason: >
  An architecture-compliant dependency must not remain represented as
  an exception.

  review: 2026-09-30

  verification:

  * architecture-validation
  * dependency-validation

# -------------------------------------------------------------------------

# EXC-011

# -------------------------------------------------------------------------

* id: EXC-011
  class: state_ownership

  source: runtime.ci/gitlab-runner-reconcile.service
  target: /var/lib/gitops

  dependency:
  type: service_state
  access: creates_and_manages
  target_owner: runtime.automation

  reason: >
  The CI reconciliation service currently creates and manages the GitOps
  worktree at /var/lib/gitops while runtime.automation also consumes and
  activates that worktree.

  owner: ci

  risk: critical

  status: active

  scope:
  permitted_operations:
  - create_worktree
  - update_worktree
  - read_worktree
  prohibited_operations:
  - create_competing_authoritative_state
  - redefine_reconciliation_state
  - bypass_deployment_health
  - bypass_rollback_policy

  state_contract:
  logical_owner: runtime.automation
  operational_consumer: runtime.ci
  filesystem_path: /var/lib/gitops

  invariant: >
  There MUST be exactly one logical owner of GitOps state even if
  multiple services require filesystem access.

  controls:

  * runtime.automation remains logical state owner
  * CI access is explicitly scoped
  * GitOps operations remain observable
  * recovery must be able to restore state
  * backup policy must account for required state
  * state transitions must not be duplicated
  * exception is explicitly referenced by dependencies.yaml

  migration:
  target: runtime.automation
  strategy: >
  Formalize /var/lib/gitops as automation-owned StateDirectory and
  expose controlled operations to CI.
  exit_condition: >
  CI no longer independently manages authoritative GitOps state.
  priority: critical

  review: 2026-10-15

  verification:

  * architecture-validation
  * service-state-ownership
  * systemd-state-directory-validation
  * ci-validation
  * recovery-validation
  * backup-validation

