# Bitwarden API Credentials
#
# This file is SOPS-encrypted. To edit:
#   1. sops secrets/bitwarden.yaml
#   2. Fill in values below
#   3. Save and exit
#
# To encrypt for the first time:
#   sops -e -i secrets/bitwarden.yaml
#
# These credentials are used for API-based authentication.
# BW_CLIENTID: Format "user.xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# BW_CLIENTSECRET: Your API client secret
# BW_PASSWORD: Your Bitwarden master password
# BW_SERVER: Self-hosted server URL (leave empty for bitwarden.com)
# BW_EMAIL: Account email (optional, used for identification)

BW_CLIENTID: "user.xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
BW_CLIENTSECRET: "your-api-client-secret"
BW_PASSWORD: "your-master-password"
BW_SERVER: ""
BW_EMAIL: ""
